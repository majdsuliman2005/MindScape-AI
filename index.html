<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindScape AI - واجهات الأسبوع الأول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 50px;
            margin-bottom: 40px;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-link {
            background: none;
            border: none;
            color: #e2e8f0;
            font-size: 1rem;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 30px;
            transition: 0.3s;
        }
        .nav-link:hover {
            background: rgba(255,255,255,0.2);
        }
        .hero {
            text-align: center;
            padding: 60px 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            margin-bottom: 40px;
        }
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #94a3b8;
        }
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .btn {
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #8b5cf6;
            color: #c084fc;
        }
        .features {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .feature-card {
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 30px;
            width: 250px;
            text-align: center;
        }
        .form-container {
            max-width: 450px;
            margin: 40px auto;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: none;
            background: rgba(0,0,0,0.3);
            color: white;
        }
        .footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #64748b;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .btn-link {
            background: none;
            border: none;
            color: #c084fc;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="navbar">
        <div class="logo">🧠 MindScape AI</div>
        <div class="nav-links">
            <button class="nav-link" onclick="showPage('landing')">الرئيسية</button>
            <button class="nav-link" onclick="showPage('login')">تسجيل الدخول</button>
            <button class="nav-link" onclick="showPage('register')">إنشاء حساب</button>
        </div>
    </div>

    <div id="landingPage" class="page active">
        <div class="hero">
            <h1>MindScape AI</h1>
            <p>محفظة المشاعر والإنتاجية الذكية</p>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="showPage('login')">تسجيل الدخول</button>
                <button class="btn btn-outline" onclick="showPage('register')">إنشاء حساب جديد</button>
            </div>
        </div>
        <div class="features">
            <div class="feature-card">📝 تحليل المشاعر الذكي</div>
            <div class="feature-card">✅ إدارة المهام بالأولويات</div>
            <div class="feature-card">⏱️ مؤقت التركيز</div>
            <div class="feature-card">🏆 نقاط وشارات</div>
        </div>
    </div>

    <div id="loginPage" class="page">
        <div class="form-container">
            <h2 style="text-align:center">تسجيل الدخول</h2>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="example@domain.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" placeholder="••••••••">
            </div>
            <button class="btn btn-primary" style="width:100%">دخول</button>
            <button class="btn-link" onclick="showPage('register')">ليس لديك حساب؟ سجل الآن</button>
            <div style="margin-top:15px; text-align:center; font-size:12px; color:#94a3b8">* واجهة توضيحية (Wireframe)</div>
        </div>
    </div>

    <div id="registerPage" class="page">
        <div class="form-container">
            <h2 style="text-align:center">إنشاء حساب جديد</h2>
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" placeholder="أحمد محمد">
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="example@domain.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>تأكيد كلمة المرور</label>
                <input type="password" placeholder="••••••••">
            </div>
            <button class="btn btn-primary" style="width:100%">تسجيل</button>
            <button class="btn-link" onclick="showPage('login')">لديك حساب؟ سجل دخولك</button>
            <div style="margin-top:15px; text-align:center; font-size:12px; color:#94a3b8">* واجهة توضيحية (Wireframe)</div>
        </div>
    </div>

    <div class="footer">
        © 2026 MindScape AI - مشروع تخرج
    </div>
</div>

<script>
    function showPage(pageId) {
        document.getElementById('landingPage').classList.remove('active');
        document.getElementById('loginPage').classList.remove('active');
        document.getElementById('registerPage').classList.remove('active');
        if (pageId === 'landing') document.getElementById('landingPage').classList.add('active');
        if (pageId === 'login') document.getElementById('loginPage').classList.add('active');
        if (pageId === 'register') document.getElementById('registerPage').classList.add('active');
    }
</script>
</body>
</html>
